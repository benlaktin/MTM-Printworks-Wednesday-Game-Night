<script>
if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function"){lucide.createIcons()}

const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwtEfA9lv-8E4IutkY7UsgWvktXAHBuY4erswfxP4KA3DARHBMUNLbto2ZU8J3megaVcw/exec';
const ADMIN_CRED={username:'admin',password:'Studio2026',role:'admin',displayName:'Admin',initials:'AD',color:'#7C3AED'};
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let DB={teachers:[],classes:[],students:[],attendance:[],events:[],loaded:false};
let currentUser=null;
let currentPage='dashboard';
let weeklyChart=null;

// ===================== UTILS =====================
function parseDays(d){if(!d)return[];if(Array.isArray(d))return d;return String(d).split(',').map(s=>s.trim()).filter(Boolean)}
function parseList(d){if(!d)return[];if(Array.isArray(d))return d;return String(d).split(',').map(s=>s.trim()).filter(Boolean)}

function formatDate(value){

    if(!value) return '';

    try{

        const dt = value.length === 10
            ? new Date(value + 'T12:00:00')
            : new Date(value);

        return dt.toLocaleDateString('en-US',{
            weekday:'short',
            month:'short',
            day:'numeric',
            year:'numeric'
        });

    }catch{

        return value;

    }

}

function formatTime(value){

    if(!value) return '';

    try{

        const str = String(value);

        if(
            str.includes('1899-12-30') ||
            str.includes('1899-12-31') ||
            str.includes('T')
        ){

            const d = new Date(value);

            return d.toLocaleTimeString('en-US',{
                hour:'numeric',
                minute:'2-digit'
            });

        }

        return value;

    }catch{

        return value;

    }

}

function formatDateTime(value){

    if(!value) return '';

    try{

        return new Date(value).toLocaleString('en-US',{
            month:'short',
            day:'numeric',
            year:'numeric',
            hour:'numeric',
            minute:'2-digit'
        });

    }catch{

        return value;

    }

}
function calculateAge(dateOfBirth){

    if(!dateOfBirth) return '';

    const today = new Date();
    const dob = new Date(dateOfBirth);

    let age = today.getFullYear() - dob.getFullYear();

    const monthDiff = today.getMonth() - dob.getMonth();

    if(
        monthDiff < 0 ||
        (monthDiff === 0 && today.getDate() < dob.getDate())
    ){
        age--;
    }

    return age;
}
function studentAgeLabel(dob){

    if(!dob) return 'Unknown';

    return `${calculateAge(dob)} yrs`;

}
function todayStr(){return new Date().toISOString().split('T')[0]}
function todayDow(){return DAYS_SHORT[new Date().getDay()]}
function getTeacher(id){return DB.teachers.find(t=>t.id===id)}
function getClass(id){return DB.classes.find(c=>c.id===id)}
function getStudent(id){return DB.students.find(s=>s.id===id)}
function initials(name){return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function uid(prefix){return prefix+Date.now()+Math.floor(Math.random()*1000)}
function canAccessClass(cls) {
  if (!cls) return false;
  if (currentUser.role === 'admin') return true;
  return cls.teacherId === currentUser.teacherId || (cls.tempTeacherId && cls.tempTeacherId === currentUser.teacherId);
}
function escH(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ===================== TOAST =====================
function showToast(msg,type='success'){
const c=document.getElementById('toast-container');
const t=document.createElement('div');t.className='toast '+type;
t.innerHTML=`<span>${escH(msg)}</span>`;
c.appendChild(t);
requestAnimationFrame(()=>t.classList.add('show'));
setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3000);
}

// ===================== MODAL =====================
function openModal(html,size='md'){
const root=document.getElementById('modal-root');
root.className='modal-overlay modal-'+size;
document.getElementById('modal-panel').innerHTML=html;
root.classList.add('open');
if(typeof lucide!=='undefined')lucide.createIcons({nameAttr:'data-lucide'});
}
function closeModal(){document.getElementById('modal-root').classList.remove('open')}
function openConfirm(title,msg,onConfirm){
const root=document.getElementById('confirm-root');
document.getElementById('confirm-panel').innerHTML=`
<h3 style="font-size:16px;font-weight:700;margin-bottom:8px">${escH(title)}</h3>
<p style="font-size:14px;color:#6b7280;margin-bottom:20px">${escH(msg)}</p>
<div style="display:flex;gap:8px;justify-content:flex-end">
<button class="btn-secondary" id="confirm-cancel">Cancel</button>
<button class="btn-danger" id="confirm-ok">Delete</button></div>`;
root.classList.add('open');

async function apiPost(action, payload) {
  try {
    const params = new URLSearchParams({ action, payload: JSON.stringify(payload || {}) });
    const r = await fetch(SCRIPT_URL + '?' + params.toString());
    const text = await r.text();
    try { return JSON.parse(text); } catch { return { ok: true }; }
  } catch(e) {
    showToast('Network error — could not save to Sheets', 'error');
    return { ok: false, error: e.message };
  }
}

function showAssignTeacherModal(cid, mode){
const cls=getClass(cid);if(!cls)return;
const isTemp=mode==='temp';
const title=isTemp?'⚡ Assign Temporary Teacher':'🔁 Change Teacher Permanently';
const desc=isTemp
  ?'The selected teacher will be added as a temporary cover. They can see all class data. The original teacher retains permanent access.'
  :'The selected teacher will permanently replace the current teacher. The previous teacher will lose all access to this class.';
const otherTeachers=DB.teachers.filter(t=>t.active!==false&&t.id!==cls.teacherId);
openModal(`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
  <h2 style="font-size:18px;font-weight:700">${title}</h2>
  <button id="at-close" style="background:none;border:none;cursor:pointer;color:#6b7280;font-size:20px;padding:4px">✕</button>
</div>
<div style="background:${isTemp?'#FEF3C7':'#FEE2E2'};border:1px solid ${isTemp?'#F59E0B':'#EF4444'};border-radius:8px;padding:12px 14px;font-size:13px;color:${isTemp?'#92400E':'#991B1B'};margin-bottom:16px;line-height:1.6">${desc}</div>
<div style="margin-bottom:8px"><p style="font-size:13px;color:#6b7280;margin-bottom:4px">Current teacher: <strong>${escH(getTeacher(cls.teacherId)?.name||'Unassigned')}</strong></p>${cls.tempTeacherId?`<p style="font-size:13px;color:#F59E0B;font-weight:600">Current temp: ${escH(getTeacher(cls.tempTeacherId)?.name||'')}</p>`:''}</div>
<div style="margin-bottom:16px"><label class="form-label">Select New ${isTemp?'Temporary ':''}Teacher</label>
<select id="at-teacher" class="form-input"><option value="">Choose a teacher…</option>${DB.teachers.filter(t=>t.active!==false).map(t=>`<option value="${t.id}">${escH(t.name)}</option>`).join('')}</select></div>
<div style="display:flex;gap:8px;justify-content:flex-end">
  <button class="btn-secondary" id="at-cancel">Cancel</button>
  <button style="background:${isTemp?'#F59E0B':'#EF4444'};color:#fff;border:none;padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer" id="at-confirm">Confirm</button>
</div>`,'md');
document.getElementById('at-close').addEventListener('click',closeModal);
document.getElementById('at-cancel').addEventListener('click',closeModal);
document.getElementById('at-confirm').addEventListener('click',async()=>{
  const newTeacherId=document.getElementById('at-teacher').value;
  if(!newTeacherId){showToast('Please select a teacher','warning');return}
  const c=getClass(cid);if(!c)return;
  let row;
  if(isTemp){
    row={...c,tempTeacherId:newTeacherId};
    showToast('Temporary teacher assigned!');
  } else {
    row={...c,teacherId:newTeacherId,tempTeacherId:''};
    showToast('Teacher permanently changed!');
  }
  const idx=DB.classes.findIndex(x=>x.id===cid);if(idx>=0)DB.classes[idx]=row;
  closeModal();renderPage();
  await apiPost('saveClass',{row});
});
}

</div>`;
document.getElementById('add-student-btn').addEventListener('click',()=>showStudentModal());

grid.innerHTML=filtered.map(s=>{
const att=DB.attendance.filter(a=>a.studentId===s.id);
const rate=att.length?Math.round(att.filter(a=>a.status==='present'||a.status==='late').length/att.length*100):0;
const stClasses=parseList(s.classes).map(cid=>getClass(cid)).filter(Boolean);
const colors=['#8B5CF6','#EC4899','#F59E0B','#10B981','#3B82F6','#EF4444'];
const color=colors[s.name.charCodeAt(0)%colors.length];
return`<div class="card" style="position:relative;cursor:pointer" data-sid="${s.id}">
<div class="hover-actions"><button class="edit-stu-btn" data-sid="${s.id}" title="Edit"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button><button class="del del-stu-btn" data-sid="${s.id}" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-right:50px"><div class="avatar" style="background:${color}">${initials(s.name)}</div><div style="min-width:0"><div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(s.name)}</div><span class="pill"
      style="background:#F3F4F6;color:#374151;font-size:11px">
    ${calculateAge(s.dateOfBirth)} yrs

<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">${stClasses.map(c=>`<span class="pill" style="background:#EDE9FE;color:#6D28D9;font-size:11px">${escH(c.name)}</span>`).join('')}</div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7280"><span>Attendance: <strong style="color:${rate>=70?'#065F46':'#991B1B'}">${rate}%</strong></span><span style="white-space:nowrap">Joined ${formatDate(s.joined)}</span></div>
</div>`}).join('');
if(typeof lucide!=='undefined')lucide.createIcons();
document.querySelectorAll('.edit-stu-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();showStudentModal(b.dataset.sid)}));
document.querySelectorAll('.del-stu-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const s=getStudent(b.dataset.sid);openConfirm('Delete Student',`Remove "${s?.name}"? This cannot be undone.`,async()=>{DB.students=DB.students.filter(x=>x.id!==b.dataset.sid);await apiPost('deleteStudent',{id:b.dataset.sid});renderStudentCards();showToast('Student deleted')})}));

</div>` : ''}
<h4 style="font-size:13px;font-weight:700;margin-bottom:8px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em">Weekly Schedule</h4>
<div class="schedule-grid" style="margin-bottom:16px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>{const dayClasses=tClasses.filter(c=>parseDays(c.days).includes(d));return`<div style="background:${dayClasses.length?'#EDE9FE':'#F9FAFB'};padding:8px;border-radius:8px;text-align:center"><div style="font-size:11px;font-weight:700;color:${dayClasses.length?'#6D28D9':'#9CA3AF'};margin-bottom:4px">${d}</div>${dayClasses.map(c=>`<div style="font-size:10px;color:#374151;background:#fff;padding:2px 6px;border-radius:4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(c.name)}</div>`).join('')||'<div style="font-size:10px;color:#d1d5db">—</div>'}</div>`}).join('')}</div>
${tClasses.length?`<h4 style="font-size:13px;font-weight:700;margin-bottom:8px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em">Classes (${tClasses.length})</h4><div style="overflow-x:auto"><table style="width:100%;min-width:420px"><thead><tr style="border-bottom:2px solid #f3f4f6"><th style="text-align:left;padding:6px 8px;font-size:12px;color:#6b7280">CLASS</th><th style="text-align:center;padding:6px 8px;font-size:12px;color:#6b7280">DAYS</th><th style="text-align:center;padding:6px 8px;font-size:12px;color:#6b7280">TIME</th><th style="text-align:center;padding:6px 8px;font-size:12px;color:#6b7280">ENROLLED</th></tr></thead><tbody>${tClasses.map(c=>{const enrolled=DB.students.filter(s=>s.active!==false&&parseList(s.classes).includes(c.id)).length;return`<tr style="border-bottom:1px solid #f9fafb"><td style="padding:6px 8px;font-size:13px;font-weight:600">${escH(c.name)}</td><td style="text-align:center;padding:6px 8px">${parseDays(c.days).map(d=>`<span class="day-chip" style="margin:1px">${d}</span>`).join('')}</td><td style="text-align:center;padding:6px 8px;font-size:13px;white-space:nowrap">${escH(formatTime(c.time))}
</td><td style="text-align:center;padding:6px 8px;font-size:13px;font-weight:600">${enrolled}</td></tr>`}).join('')}</tbody></table></div>`:''}`}).join('');
if(typeof lucide!=='undefined')lucide.createIcons();
document.querySelectorAll('.pwd-toggle').forEach(b=>b.addEventListener('click',function(){
const mask=document.querySelector(`.pwd-mask[data-tid="${this.dataset.tid}"]`);
if(this.textContent==='Show'){mask.textContent=this.dataset.pwd;this.textContent='Hide'}else{mask.textContent='••••••••';this.textContent='Show'}
}));
if(isAdmin){
document.querySelectorAll('.edit-tea-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();showTeacherModal(b.dataset.tid)}));
document.querySelectorAll('.del-tea-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const t=getTeacher(b.dataset.tid);openConfirm('Delete Teacher',`Remove "${t?.name}"? Their classes will become unassigned.`,async()=>{DB.teachers=DB.teachers.filter(x=>x.id!==b.dataset.tid);await apiPost('deleteTeacher',{id:b.dataset.tid});renderPage();showToast('Teacher deleted')})}));
}
}
renderTeacherTab('all');
if(isAdmin){
document.querySelectorAll('#teacher-tabs .tab-btn-item').forEach(tb=>tb.addEventListener('click',function(){
document.querySelectorAll('#teacher-tabs .tab-btn-item').forEach(x=>x.classList.remove('active'));this.classList.add('active');
renderTeacherTab(this.dataset.ttab);
}));
}
}

function showTeacherModal(editId){
const t=editId?getTeacher(editId):null;
openModal(`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="font-size:18px;font-weight:700">${t?'Edit Teacher':'Add New Teacher'}</h2><button id="mt-close" style="background:none;border:none;cursor:pointer;color:#6b7280;font-size:20px;padding:4px">✕</button></div>
<div style="display:flex;flex-direction:column;gap:14px">
<div><label class="form-label">Full Name *</label><input id="mt-name" class="form-input" value="${t?escH(t.name):''}" placeholder="Teacher name"></div>
<div><label class="form-label">Specialty</label><input id="mt-specialty" class="form-input" value="${t?escH(t.specialty||''):''}" placeholder="e.g. Ballet & Contemporary"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label class="form-label">Username *</label><input id="mt-user" class="form-input" value="${t?escH(t.username||''):''}" placeholder="username"></div>
<div><label class="form-label">Password *</label><input id="mt-pass" class="form-input" value="${t?escH(t.password||''):''}" placeholder="password"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label class="form-label">Color</label><input id="mt-color" class="form-input" type="color" value="${t?t.color:'#8B5CF6'}"></div>
<div><label class="form-label">Initials</label><input id="mt-initials" class="form-input" value="${t?escH(t.initials||''):''}" placeholder="Auto from name" maxlength="2"></div>
</div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
<button class="btn-secondary" id="mt-cancel">Cancel</button>
<button class="btn-primary" id="mt-save"><i data-lucide="save" class="w-4 h-4"></i> Save Teacher</button>
</div></div>`,'md');
document.getElementById('mt-close').addEventListener('click',closeModal);
document.getElementById('mt-cancel').addEventListener('click',closeModal);
document.getElementById('mt-save').addEventListener('click',async()=>{
const name=document.getElementById('mt-name').value.trim();
const username=document.getElementById('mt-user').value.trim();
const password=document.getElementById('mt-pass').value.trim();
if(!name){showToast('Name is required','error');return}
if(!username||!password){showToast('Username and password are required','error');return}
const row={id:t?t.id:uid('T'),name,specialty:document.getElementById('mt-specialty').value.trim(),username,password,color:document.getElementById('mt-color').value,initials:document.getElementById('mt-initials').value.trim()||initials(name),active:true};
const idx=DB.teachers.findIndex(x=>x.id===row.id);if(idx>=0)DB.teachers[idx]=row;else DB.teachers.push(row);
closeModal();renderPage();showToast('Teacher saved!');buildQuickLogins();
await apiPost('saveTeacher',{row});
});
if(typeof lucide!=='undefined')lucide.createIcons();
}

// ===================== EVENTS =====================
function renderEvents(mc){
const eventTypeColors={competition:'#7C3AED',recital:'#3B82F6',workshop:'#10B981',rehearsal:'#F59E0B',other:'#6B7280'};
const events=DB.events.sort((a,b)=>a.date.localeCompare(b.date));
const grouped={};events.forEach(e=>{const m=new Date(e.date+'T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});if(!grouped[m])grouped[m]=[];grouped[m].push(e)});
mc.innerHTML=`<div class="fade-in">
<div class="page-header">
<h1 style="font-size:24px;font-weight:700">Studio Events</h1>
<button id="add-event-btn" class="btn-primary"><i data-lucide="plus" class="w-4 h-4"></i> Add Event</button>
</div>
<div id="events-list">
${events.length?Object.entries(grouped).map(([month,evts])=>`
<h3 style="font-size:14px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin:20px 0 12px">${escH(month)}</h3>
${evts.map(e=>{
const col=e.color||eventTypeColors[e.type]||'#6B7280';
const clsList=parseList(e.classIds).map(cid=>getClass(cid)).filter(Boolean);
return`<div class="card" style="position:relative;margin-bottom:12px;border-left:4px solid ${col};padding-left:20px">
<div class="hover-actions"><button class="edit-evt-btn" data-eid="${e.id}" title="Edit"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button><button class="del del-evt-btn" data-eid="${e.id}" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></div>
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-right:60px">
<div style="flex:1;min-width:0">
<h4 style="font-size:16px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(e.name)}</h4>
<div style="font-size:13px;color:#6b7280;margin-bottom:6px">${formatDate(e.date)}${e.endDate&&e.endDate!==e.date?' — '+formatDate(e.endDate):''}</div>
${e.location?`<div style="font-size:13px;color:#6b7280;display:flex;align-items:center;gap:4px;margin-bottom:6px"><i data-lucide="map-pin" class="w-3.5 h-3.5" style="flex-shrink:0"></i><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escH(e.location)}</span></div>`:''}
${e.description?`<p style="font-size:13px;color:#4b5563;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escH(e.description)}</p>`:''}
${clsList.length?`<div style="display:flex;gap:4px;flex-wrap:wrap">${clsList.map(c=>`<span class="pill" style="background:#EDE9FE;color:#6D28D9;font-size:10px">${escH(c.name)}</span>`).join('')}</div>`:''}
</div>
<span class="event-type-badge" style="background:${col}22;color:${col}">${escH(e.type||'event')}</span>
</div></div>`}).join('')}`).join(''):`<div class="empty-state"><i data-lucide="calendar-heart" class="w-12 h-12"></i><p style="font-size:15px;margin-top:8px">No events scheduled</p><p style="font-size:13px;color:#9ca3af">Add your first event!</p><button class="btn-primary" style="margin-top:12px" id="empty-add-evt"><i data-lucide="plus" class="w-4 h-4"></i> Add Event</button></div>`}
</div>
<footer style="padding:24px 0 8px;text-align:center"><p style="font-size:12px;color:#9ca3af">Made by Copilot</p></footer>
</div>`;
document.getElementById('add-event-btn').addEventListener('click',()=>showEventModal());
const emptyBtn=document.getElementById('empty-add-evt');if(emptyBtn)emptyBtn.addEventListener('click',()=>showEventModal());
document.querySelectorAll('.edit-evt-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();showEventModal(b.dataset.eid)}));
document.querySelectorAll('.del-evt-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const ev=DB.events.find(x=>x.id===b.dataset.eid);openConfirm('Delete Event',`Delete "${ev?.name}"?`,async()=>{DB.events=DB.events.filter(x=>x.id!==b.dataset.eid);await apiPost('deleteEvent',{id:b.dataset.eid});renderPage();showToast('Event deleted')})}));
if(typeof lucide!=='undefined')lucide.createIcons();
}

function showEventModal(editId){
const ev=editId?DB.events.find(e=>e.id===editId):null;
const typeColors={competition:'#7C3AED',recital:'#3B82F6',workshop:'#10B981',rehearsal:'#F59E0B',other:'#6B7280'};
const evClasses=ev?parseList(ev.classIds):[];
openModal(`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h2 style="font-size:18px;font-weight:700">${ev?'Edit Event':'Add New Event'}</h2><button id="me-close" style="background:none;border:none;cursor:pointer;color:#6b7280;font-size:20px;padding:4px">✕</button></div>
<div style="display:flex;flex-direction:column;gap:14px">
<div><label class="form-label">Event Name *</label><input id="me-name" class="form-input" value="${ev?escH(ev.name):''}" placeholder="Event name"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label class="form-label">Type</label><select id="me-type" class="form-input"><option value="competition" ${ev&&ev.type==='competition'?'selected':''}>Competition</option><option value="recital" ${ev&&ev.type==='recital'?'selected':''}>Recital</option><option value="workshop" ${ev&&ev.type==='workshop'?'selected':''}>Workshop</option><option value="rehearsal" ${ev&&ev.type==='rehearsal'?'selected':''}>Rehearsal</option><option value="other" ${ev&&ev.type==='other'?'selected':''}>Other</option></select></div>
<div><label class="form-label">Color</label><input id="me-color" type="color" class="form-input" value="${ev?ev.color||typeColors[ev.type]||'#6B7280':typeColors.competition}"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label class="form-label">Start Date *</label><input id="me-date" type="date" class="form-input" value="${ev?ev.date:''}"></div>
<div><label class="form-label">End Date</label><input id="me-edate" type="date" class="form-input" value="${ev?ev.endDate||'':''}"></div>
</div>
<div><label class="form-label">Location</label><input id="me-loc" class="form-input" value="${ev?escH(ev.location||''):''}" placeholder="e.g. Riverside Theatre"></div>
<div><label class="form-label">Description</label><textarea id="me-desc" class="form-input" rows="3" placeholder="Event details…">${ev?escH(ev.description||''):''}</textarea></div>
<div><label class="form-label">Involved Classes</label><div class="checkbox-group" id="me-classes">${DB.classes.filter(c=>c.active!==false).map(c=>`<label class="checkbox-item"><input type="checkbox" value="${c.id}" ${evClasses.includes(c.id)?'checked':''}>${escH(c.name)}</label>`).join('')}</div></div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
<button class="btn-secondary" id="me-cancel">Cancel</button>
<button class="btn-primary" id="me-save"><i data-lucide="save" class="w-4 h-4"></i> Save Event</button>
</div></div>`,'md');
document.getElementById('me-close').addEventListener('click',closeModal);
document.getElementById('me-cancel').addEventListener('click',closeModal);
document.getElementById('me-type').addEventListener('change',function(){document.getElementById('me-color').value=typeColors[this.value]||'#6B7280'});
document.getElementById('me-save').addEventListener('click',async()=>{
const name=document.getElementById('me-name').value.trim();
const date=document.getElementById('me-date').value;
if(!name){showToast('Event name is required','error');return}
if(!date){showToast('Start date is required','error');return}
const classIds=Array.from(document.querySelectorAll('#me-classes input:checked')).map(i=>i.value).join(',');
const row={id:ev?ev.id:uid('E'),name,date,endDate:document.getElementById('me-edate').value||date,type:document.getElementById('me-type').value,location:document.getElementById('me-loc').value.trim(),description:document.getElementById('me-desc').value.trim(),classIds,createdBy:currentUser.displayName,color:document.getElementById('me-color').value};
const idx=DB.events.findIndex(x=>x.id===row.id);if(idx>=0)DB.events[idx]=row;else DB.events.push(row);
closeModal();renderPage();showToast('Event saved!');
await apiPost('saveEvent',{row});
});
if(typeof lucide!=='undefined')lucide.createIcons();
}

// ===================== GLOBAL EVENTS =====================
document.getElementById('modal-root').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('confirm-root').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open')});
document.addEventListener('keydown',function(e){
if(e.key==='Escape'){closeModal();document.getElementById('confirm-root').classList.remove('open')}
if(e.key==='Enter'){
const modal=document.getElementById('modal-root');
if(modal.classList.contains('open')){
const saveBtn=modal.querySelector('.btn-primary');
if(saveBtn&&document.activeElement?.tagName!=='TEXTAREA')saveBtn.click();
}
}
});

document.getElementById('login-btn').addEventListener('click',doLogin);
document.getElementById('login-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
document.getElementById('login-user').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('login-pass').focus()});

document.getElementById('logout-btn').addEventListener('click',()=>{
sessionStorage.removeItem('studiotrack_session');currentUser=null;
document.getElementById('app-shell').style.display='none';
document.getElementById('login-screen').style.display='block';
document.getElementById('login-user').value='';document.getElementById('login-pass').value='';
document.getElementById('login-error').style.display='none';
});

document.getElementById('sidebar-toggle').addEventListener('click',()=>{
const sb=document.getElementById('sidebar');const btn=document.getElementById('sidebar-toggle');
sb.classList.toggle('collapsed');btn.textContent=sb.classList.contains('collapsed')?'›':'‹';
});

document.getElementById('mobile-menu-btn').addEventListener('click', () => {

    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('mobile-backdrop');

    const opening = !sb.classList.contains('mobile-open');

    if (opening) {

        sb.classList.add('mobile-open');
        bd.classList.add('show');

    } else {

        sb.classList.remove('mobile-open');
        bd.classList.remove('show');

    }

});

document.getElementById('mobile-backdrop').addEventListener('click',()=>{
document.getElementById('sidebar').classList.remove('mobile-open');
document.getElementById('mobile-backdrop').classList.remove('show');
});

// ===================== INIT =====================
(async function init(){
  try {
    await apiGet();
  } catch(e) {
    return;
  }
  document.getElementById('loading-screen').style.display = 'none';
  buildQuickLogins();
  if(tryResumeSession()) { showApp(); } else { document.getElementById('login-screen').style.display = 'block'; }
  if(typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') lucide.createIcons();
})();


</script>
</body>
</html>
